name: Temporary CI Repair

on:
  push:
    branches: [chatgpt/ci-repair]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ci-repair
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.1
      - name: Apply safe Ruff fixes and formatting
        working-directory: backend
        run: |
          ruff check . --fix
          ruff format .
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No formatter changes to commit."
          else
            git commit -m "Apply Ruff safe fixes and formatting"
            git push origin HEAD:chatgpt/ci-repair
          fi
